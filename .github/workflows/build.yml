name: Build DRAGONIC WORM BUILDER APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          export PATH=/opt/gradle-8.7/bin:$PATH
          echo "GRADLE_HOME=/opt/gradle-8.7" >> $GITHUB_ENV
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          gradle --version

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonicWormBuilder-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonicWormBuilder-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Show build result
        run: |
          echo "==============================="
          echo " DRAGONIC WORM BUILDER - Done!"
          echo " Developed by Dev Leonore"
          echo "==============================="
          ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null || true
          ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null || true

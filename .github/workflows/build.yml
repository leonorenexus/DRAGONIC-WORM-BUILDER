name: Build DRAGONIC WORM BUILDER APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonicWormBuilder-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonicWormBuilder-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Show build result
        run: |
          echo "==============================="
          echo " DRAGONIC WORM BUILDER - Built!"
          echo " Developed by Dev Leonore"
          echo "==============================="
          ls -lh app/build/outputs/apk/debug/*.apk 2>/dev/null || true
          ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null || true
